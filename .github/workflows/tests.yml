name: 🧪 Tests
on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/tests.yml"
      - ".github/actions/setup/**"

concurrency:
  group: e2e-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: 🎭 e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      TURBO_API: ${{ secrets.TURBO_API }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      PLAYWRIGHT_VERSION: "1.60.0"
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v7

      - name: 🔒 Verify Playwright version matches container
        shell: bash
        run: |
          got="$(node -p "require('./apps/philipplentzen/package.json').devDependencies['@playwright/test']")"
          if [ "$PLAYWRIGHT_VERSION" != "$got" ]; then
            echo "::error::Container Playwright ($PLAYWRIGHT_VERSION) != @playwright/test ($got). Update the container tag and PLAYWRIGHT_VERSION together."
            exit 1
          fi

      - name: 🛠️ Setup
        uses: ./.github/actions/setup

      - name: 🎭 Run e2e tests
        run: pnpm run e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/philipplentzen/playwright-report/
          retention-days: 30

      - name: 💬 Comment on failure
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- e2e-visual-diff -->';
            const body = `${marker}\n🎭 **e2e tests failed.** Download the \`playwright-report\` artifact from the [run](${runUrl}) to inspect the visual diffs.\n\nIf the changes are intended, add the **\`update-snapshots\`** label to this PR to regenerate and commit new baselines.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
