version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    labels:
      - "actions"
    groups:
      actions-deps:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    labels:
      - "dependencies"
    ignore:
      # Held back for now: TypeScript 6 drops automatic global @types inclusion,
      # which breaks the @types/mdx `declare module "*.mdx"` used by MDX imports.
      - dependency-name: "typescript"
      - dependency-name: "lucide-react"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
